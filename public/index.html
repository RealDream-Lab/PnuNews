<!doctype html>
<html lang="fa" dir="rtl" data-theme="auto">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#1f5fbf">
  <meta name="description" content="خبرهای پیام نور بر اساس شهرستان">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="/reader/styles.v1.css">
  <script src="/shared/theme.v1.js"></script>
  <title>اخبار پیام نور</title>
</head>
<body>
  <svg class="icon-sprite" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
    <symbol id="icon-location" viewBox="0 0 24 24"><path d="M12 21s7-6.2 7-12a7 7 0 1 0-14 0c0 5.8 7 12 7 12Z"/><circle cx="12" cy="9" r="2.3"/></symbol>
    <symbol id="icon-chevron" viewBox="0 0 24 24"><path d="m15 5-7 7 7 7"/></symbol>
    <symbol id="icon-search" viewBox="0 0 24 24"><circle cx="10.8" cy="10.8" r="6.8"/><path d="m16 16 5 5"/></symbol>
    <symbol id="icon-sun" viewBox="0 0 24 24"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></symbol>
    <symbol id="icon-moon" viewBox="0 0 24 24"><path d="M20.5 14.2A8.5 8.5 0 0 1 9.8 3.5 8.7 8.7 0 1 0 20.5 14.2Z"/></symbol>
    <symbol id="icon-play" viewBox="0 0 24 24"><path d="m8 5 12 7-12 7V5Z"/></symbol>
    <symbol id="icon-pause" viewBox="0 0 24 24"><path d="M8 5h3v14H8zm6 0h3v14h-3z"/></symbol>
    <symbol id="icon-share" viewBox="0 0 24 24"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.7 10.7 6.6-4.4m-6.6 9 6.6 4.1"/></symbol>
    <symbol id="icon-volume" viewBox="0 0 24 24"><path d="M4 10v4h4l5 4V6l-5 4H4Zm12-1a5 5 0 0 1 0 6m2-9a9 9 0 0 1 0 12"/></symbol>
  </svg>
  <div class="page-shell">
    <header class="site-header">
      <a class="brand" href="/" aria-label="صفحهٔ اصلی اخبار پیام نور"><span class="brand-mark">پ</span><span class="brand-name" id="site-title">اخبار پیام نور</span></a>
      <div class="header-actions">
        <button class="city-button" id="city-button" type="button" aria-haspopup="dialog" aria-controls="city-picker">
          <svg class="icon"><use href="#icon-location"/></svg><span id="selected-city-label">انتخاب شهرستان</span><svg class="icon city-chevron"><use href="#icon-chevron"/></svg>
        </button>
        <div class="reading-controls" aria-label="تنظیمات نمایش">
          <button class="icon-button font-down" type="button" aria-label="کوچک کردن اندازهٔ نوشته">A−</button>
          <button class="icon-button font-up" type="button" aria-label="بزرگ کردن اندازهٔ نوشته">A+</button>
          <button class="icon-button theme-toggle" type="button" aria-label="تغییر حالت روشنایی"><svg class="icon"><use href="#icon-sun"/></svg></button>
        </div>
      </div>
    </header>
    <main id="app" class="reader-main">
      <section class="feed-intro" aria-labelledby="feed-heading">
        <div><p class="eyebrow">روایت تازه از دانشگاه</p><h1 id="feed-heading">خبرهای پیام نور</h1><p class="intro-copy" id="feed-description">برای دیدن خبرهای مرتبط، شهرستان خود را انتخاب کنید.</p></div>
        <div class="intro-decoration" aria-hidden="true"><span></span><span></span><span></span></div>
      </section>
      <div class="scope-row" role="group" aria-label="محدودهٔ خبرها">
        <button type="button" class="scope-chip is-active" data-scope="all" aria-pressed="true">همه</button>
        <button type="button" class="scope-chip" data-scope="country" aria-pressed="false">کشوری</button>
        <button type="button" class="scope-chip" data-scope="province" aria-pressed="false">استان</button>
        <button type="button" class="scope-chip" data-scope="city" aria-pressed="false">شهر</button>
      </div>
      <div id="new-items-banner" class="new-items-banner" hidden><button type="button">خبرهای تازه آماده است؛ برای دیدن به بالای فهرست بروید</button></div>
      <section id="pinned-strip" class="pinned-strip" aria-label="خبرهای مهم" hidden></section>
      <section id="feed" class="news-feed" aria-live="polite" aria-busy="false"></section>
      <div id="feed-sentinel" class="feed-sentinel" aria-hidden="true"></div>
      <p id="feed-message" class="feed-message" role="status"></p>
    </main>
    <main id="news-view" class="reader-main" hidden></main>
    <footer class="site-footer"><span>اخبار پیام نور</span><span>برای آگاهی، نزدیک‌تر</span></footer>
  </div>
  <div id="radio-root"></div>
  <dialog id="city-picker" class="city-dialog" aria-labelledby="picker-title">
    <div class="picker-panel">
      <div class="picker-header"><div><p class="eyebrow">انتخاب محدوده</p><h2 id="picker-title">استان را انتخاب کنید</h2></div><button class="icon-button picker-close" type="button" aria-label="بستن پنجره">×</button></div>
      <button id="picker-back" class="picker-back" type="button" hidden><svg class="icon"><use href="#icon-chevron"/></svg><span>بازگشت به استان‌ها</span></button>
      <label class="search-field"><svg class="icon"><use href="#icon-search"/></svg><input id="picker-search" type="search" autocomplete="off" placeholder="جست‌وجو" aria-label="جست‌وجوی استان یا شهرستان"></label>
      <div id="picker-list" class="picker-list" role="listbox" aria-label="فهرست مناطق"></div>
      <p class="picker-hint">برای ادامه، شهرستان موردنظر را انتخاب کنید.</p>
    </div>
  </dialog>
  <div id="toast" class="toast" role="status" aria-live="polite"></div>
  <script type="module" src="/reader/app.v1.js"></script>
</body>
</html>
